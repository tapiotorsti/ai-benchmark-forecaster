# Ennusteasetukset (K5, määrittely 5).
#
# Päätökset 2026-11-13:
# - rintamatrendi sovitetaan vuoden 2023 alusta (GPT-4-aikakausi) + palaisuustesti 12 kk
# - kustannustasot: GPT-4, Claude 3.5 Sonnet (Oct 2024) ja GPT-5. Taso määritellään
#   viitemallin kautta → taso = mallin θ kulloisessakin IRT-ajossa.

fit_start: 2023-01-01
horizons_months: [6, 12, 18, 24]
n_boot: 1000
seed: 0
piecewise_window_months: 12
piecewise_alpha: 0.05
backtest_holdout_months: 12
# Liukuva backtest (A24): lähtöpäivät as_of − k kk. Kukin arvioi toteutuneet rintamapisteet
# enintään holdout-kuukauden verran eteenpäin, kuitenkin vain nykyhetkeen asti (k < holdout →
# horisontti k). Kalibraatio = osuus pisteistä P10–P90-välillä (± lähtöpäivätason SE).
backtest_origins_months: [6, 12, 18, 24]
# Mallit, joiden θ-keskivirhe on tätä suurempi, jätetään ennusteista pois (raportoidaan).
# Syy: θ heikosti määrätty (vähän tuloksia, heikosti erottelevia testejä tai lattiatason
# tuloksia, esim. llama-3-2-1b, SE 11.8) → bootstrap-draw N(θ, SE²) nostaisi
# mallin satunnaisesti rintamaan ja räjäyttäisi ennustevälin.
max_theta_se: 1.0
# Horisonttikohtainen hintalattia (A26, päätös 2026-11-16): h kk:n ennusteen alaraja on halvin
# malli, jolle taso − β·h/12 ≤ θ < taso (β = rintaman kehitysvauhti θ/v), jos se on tason
# nykyistä halvinta halvempi; muuten koko markkinan halvin. Koko markkinan halvin voi olla
# paljon tasoa heikompi (esim. ministral-3b, θ −0.4) eikä kerro, mihin tason hinta voi pudota.
level_floor: true
# Pienen otoksen korjaus kyvykkyyden bootstrapiin (A27): none | inflate | auto. inflate
# skaalaa kertoimien drawit piste-estimaatin ympäriltä ja ennustekohinan kertoimella √(n/(n−p)).
# auto = inflate, kun rintamassa on alle small_sample_max_points pistettä (päätös 2026-11-17).
# Synteettinen Monte Carlo 2026-11-17 (lineaarinen tosi trendi, kohina 0.25, θ-SE 0.15;
# 80 %:n ennustevälin kattavuus, 250 toistoa, ± SE):
#   rintama ~9 pistettä:  none 0.72 ± 0.02, inflate 0.80 ± 0.02
#   rintama ~16 pistettä: none 0.81 ± 0.02, inflate 0.85 ± 0.02 (näyttää ylikattavan)
# Rintaman koko 2026-11-17: kokonaisennuste 21, liukuvan backtestin lähtöpäivät 6 / 9 / 12 / 16
# (korjaus kahdella vanhimmalla), osa-alueet 8–23. Raja 12 on päätös, ei mitattu taitekohta. Kulmakertoimen P10–P90 on kummassakin tilassa liian kapea (~0.7, ks. A27).
small_sample: auto
small_sample_max_points: 12
# Sovitusikkunan epävarmuus (A28): jokaisessa bootstrap-drawissa sovitus alkaa satunnaisesti
# fit_startista tai as_of − w kk (w näistä, yhtä suuret painot; pois ikkunat, jotka alkaisivat
# ennen fit_startia tai joiden rintamassa on alle min_points + 1 pistettä). Lyhyissä ikkunoissa
# ei saranatestiä. Väli levenee aina hieman (tasaisessa kehityksessä yli tavoitteen) ja
# enemmän, kun tuore ja pitkän aikavälin vauhti eroavat.
# Synteettinen Monte Carlo 2026-11-18 (200 toistoa, ± ~0.02; 80 %:n ennustevälin kattavuus
# 12 kk:n rintamapisteille; ~16 pisteen rintama):
#   ikkunat           tasainen kehitys   kiihtyminen 15 kk ennen lähtöpäivää (0.3 → 2.0 θ/v)
#   ei                0.82               0.70
#   24                0.84               0.77
#   18/24/36          0.87               0.81   ← valittu (päätös 2026-11-18)
#   12/18/24/36       0.89               0.83
fit_windows_months: [18, 24, 36]

cost_targets:
  - {label: GPT-4, model_id: gpt-4-jun-2023}
  - {label: Claude 3.5 Sonnet (Oct 2024), model_id: claude-3-5-sonnet-october-2024}
  - {label: GPT-5, model_id: gpt-5}
