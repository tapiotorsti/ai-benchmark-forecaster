# Epoch AI -benchmarkien kuvaus projektin benchmarkeiksi (K3).
#
# Avain = Epochin benchmark_metadata.csv:n `benchmark`-nimi.
# Seuraavat luetaan automaattisesti Epochin metatiedoista, ellei niitä ohiteta tässä:
#   raw_min = 0, raw_max = score_ceiling, guessing_floor = random_baseline / score_ceiling
#   (arvausraja normalisoidulla asteikolla, A8), release_date, source_file, score_column, scale
#
# Pakollinen: benchmark_id, domain. Valinnainen: weight, contamination_risk, include,
# source_file/score_column/scale (tarvitaan Epochin ECI:n ulkopuolisille testeille),
# score_ceiling + ceiling_source (julkaistu todellinen katto raaka-asteikolla; ohittaa
# Epochin score_ceilingin ja siten myös arvausrajan normalisoinnin).
#
# Katot 2026-11-16: kokeilussa julkaistu ihmisten tarkkuus katoksi nosti HellaSwagin ja
# PIQAn erottelukykyä vain vähän (a 0.29 → 0.34, 0.15 → 0.18), ECI-korrelaatio ennallaan.
# Vanhojen testien matala a on siis pääosin aitoa (tulos kasvaa hitaasti laajalla θ-välillä).
# Empiiristä maksimia ei käytetä katona: se on kehämäinen ja leikkaisi tulevat tulokset.
#
# Metatietojen ECI-benchmarkit, joita ei ole listattu tässä, raportoidaan ingest-raportissa
# ("kuvaamattomat benchmarkit") eikä niitä tuoda.
#
# domain-arvio merkitty (?) = arvio, tarkista K4:ssä.
# contamination_risk: high = vanha julkinen testi, low = yksityinen/pidätetty testijoukko.

benchmarks:
